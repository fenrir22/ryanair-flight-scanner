version: '3.8'

services:
  ryanair-scanner:
    image: ghcr.io/fenrir22/ryanair-flight-scanner:master
    container_name: ryanair-scanner
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MARKET=it-it
      - MAX_CONCURRENT_REQUESTS=3
      - REQUEST_TIMEOUT=15000
      - MAX_RETRIES=2
      - CACHE_TTL=300
      - DEFAULT_CURRENCY=EUR
      - CORS_ORIGIN=http://localhost:8080
      - NTFY_URL=https://ntfy.sh
      - SCAN_INTERVAL=86400000
    volumes:
      - scanner-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  scanner-data:
